name: Deploy

# Merge to main deploys newnotams.net with nobody touching the console,
# mirroring home-platform's own deploy.yml (ADR-0009). Before this workflow
# existed, every deploy to NewNotamsStack was a manual `cdk deploy` run by
# hand -- this closes that gap.
#
# dev proves the credential chain end to end (there is no dev-scoped stack
# here either, same as home-platform's own deploy-dev job -- NewNotamsStack
# is tagged env=prod) before the prod approval gate is reached. prod builds
# the real app, runs the real OpenNext build, and deploys NewNotamsStack for
# real, gated by the prod GitHub Environment's required reviewer.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  # Any permission not listed here is forced to `none` -- GITHUB_TOKEN
  # needs this explicitly to pull @josephkan3/constructs and
  # @josephkan3/config from GitHub Packages (npm.pkg.github.com), even
  # though both packages are public.
  packages: read

env:
  AWS_REGION: us-east-1
  MGMT_ACCOUNT_ID: ${{ vars.MGMT_ACCOUNT_ID }}
  PLATFORM_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}

# One deploy at a time. cancel-in-progress is deliberately false: cancelling
# mid-CloudFormation leaves the stack in UPDATE_IN_PROGRESS.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          AUTH_SECRET: placeholder-for-build-check-only
          AUTH_GOOGLE_ID: placeholder
          AUTH_GOOGLE_SECRET: placeholder
          KV_REST_API_URL: https://placeholder.upstash.io
          KV_REST_API_TOKEN: placeholder
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder
          VAPID_PRIVATE_KEY: placeholder
        run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@josephkan3"
      - name: Build and test cdk/
        working-directory: cdk
        run: |
          npm ci
          npm run build
          npm test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    name: dev
    needs: build
    # `environment: dev` is what puts `environment:dev` in the OIDC sub
    # claim. gha-newnotams-deploy-dev's trust policy is StringEquals on
    # repo:JosephKan3@54008059/NewNotams.Net@1174868537:environment:dev --
    # without this key the token carries a different sub and the
    # AssumeRole is refused.
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@josephkan3"
      - name: Install
        working-directory: cdk
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        working-directory: cdk
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-newnotams-deploy-dev-${{ github.run_id }}

      - name: Confirm the assumed identity
        run: aws sts get-caller-identity

      # NewNotamsStack is tagged env=prod (there is no dev-scoped stack,
      # same situation as home-platform's own deploy-dev job) -- this
      # job's real purpose is to prove the dev credential chain works end
      # to end before the prod gate is reached: assume the role,
      # synthesize, fail here rather than after an approval.
      - name: Synth
        working-directory: cdk
        run: npx cdk synth NewNotamsStack -c sitePlaceholder=true

  deploy-prod:
    name: prod
    needs: deploy-dev
    # `environment: prod` is LOAD-BEARING, in two independent ways:
    #
    #   1. The GitHub Environment protection rule (required reviewer) is
    #      what gates this job. There is no other approval step here.
    #   2. gha-newnotams-deploy-prod's trust policy is StringEquals on
    #      repo:...:environment:prod. GitHub only puts `environment:prod`
    #      in the OIDC sub claim when the job declares this key. Remove it
    #      and the role cannot be assumed at all -- the deploy fails at
    #      AssumeRole, it does not silently deploy unreviewed.
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-newnotams-deploy-prod-${{ github.run_id }}

      - name: Confirm the assumed identity
        run: aws sts get-caller-identity

      # NEXT_PUBLIC_* vars are inlined into the client JS bundle at build
      # time, unlike every other var below -- those are server-only and get
      # their real value injected into the Lambda's runtime environment by
      # CDK/SSM after this build step runs, so "placeholder" there is
      # harmless. This one has no such second chance: a placeholder baked
      # in here ships to every browser, and pushManager.subscribe() throws
      # synchronously on an invalid key, breaking "Enable notifications"
      # silently (the public key is the public half of the keypair -- fine
      # to read here, no different from it being public in a NEXT_PUBLIC_
      # var in the first place).
      #
      # gha-newnotams-deploy-prod itself holds no direct AWS permissions --
      # only sts:AssumeRole on the cdk-hnbprod-* bootstrap roles (least
      # privilege, see GitHubOidcStack) -- so a bare ssm:GetParameter call
      # under its own identity is denied. A first attempt at this step did
      # exactly that: the AccessDeniedException landed inside a `$(...)`
      # substitution, so `echo` still exited 0 and silently baked in an
      # *empty* string, which is worse than the literal "placeholder" it
      # replaced. Assuming the prod lookup role (ReadOnlyAccess, already
      # grantable to this role, and the correct role for exactly this kind
      # of synth/build-time read) fixes both the permission and removes the
      # silent-failure shape -- `set -eo pipefail` makes a denied
      # get-parameter fail the step loudly instead.
      - name: Fetch the real VAPID public key for the client bundle
        run: |
          set -eo pipefail
          CREDS=$(aws sts assume-role \
            --role-arn arn:aws:iam::${{ vars.PLATFORM_ACCOUNT_ID }}:role/cdk-hnbprod-lookup-role-${{ vars.PLATFORM_ACCOUNT_ID }}-${{ env.AWS_REGION }} \
            --role-session-name gha-newnotams-vapid-lookup-${{ github.run_id }} \
            --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            --output text)
          read -r AK SK ST <<< "$CREDS"
          VAPID_PUBLIC_KEY=$(AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" AWS_SESSION_TOKEN="$ST" \
            aws ssm get-parameter --name /newnotams/push/vapid-public-key --region ${{ env.AWS_REGION }} \
            --query Parameter.Value --output text)
          # Belt-and-suspenders after the exact failure mode above (a
          # denied call inside $(...) not failing the step): refuse to
          # proceed with an empty key rather than silently shipping one.
          if [ -z "$VAPID_PUBLIC_KEY" ]; then
            echo "::error::VAPID_PUBLIC_KEY came back empty from SSM" >&2
            exit 1
          fi
          echo "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY" >> "$GITHUB_ENV"

      # The real OpenNext build. Placeholder mode is for CI's own synth/
      # diff checks only -- deploying with it would publish a placeholder
      # page to the live domain.
      - name: Build the app and run the OpenNext build
        env:
          AUTH_SECRET: placeholder-for-build-check-only
          AUTH_GOOGLE_ID: placeholder
          AUTH_GOOGLE_SECRET: placeholder
          KV_REST_API_URL: https://placeholder.upstash.io
          KV_REST_API_TOKEN: placeholder
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: placeholder
        run: |
          npm run build
          npx open-next build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@josephkan3"
      - name: Install cdk/ dependencies
        working-directory: cdk
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cdk/
        working-directory: cdk
        run: npm run build

      # --outputs-file, not a separate `aws cloudformation describe-stacks`
      # call: gha-newnotams-deploy-prod's own policy grants nothing but
      # sts:AssumeRole on the four cdk-hnbprod-*-role ARNs (least
      # privilege, same shape as home-platform's gha-deploy-prod). `cdk
      # deploy` can read the stack back because it assumes
      # cdk-hnbprod-deploy-role internally for the duration of the CDK
      # CLI process; a standalone `aws cloudformation describe-stacks`
      # afterwards runs under gha-newnotams-deploy-prod's own bare
      # identity and would be denied with AccessDenied on
      # cloudformation:DescribeStacks -- see home-platform's deploy.yml
      # comment on this same finding for personal-site.
      - name: Deploy NewNotamsStack
        working-directory: cdk
        run: >-
          npx cdk deploy NewNotamsStack
          --require-approval never
          -c repoRootPath=${{ github.workspace }}
          -c alertEmail=${{ vars.ALERT_EMAIL }}
          --outputs-file ${{ github.workspace }}/newnotams-outputs.json

      - name: Report the distribution domain
        run: |
          jq -r '.NewNotamsStack.DistributionDomainName' \
            ${{ github.workspace }}/newnotams-outputs.json
